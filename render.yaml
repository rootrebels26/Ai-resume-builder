services:
  - type: web
    name: ai-resume-builder-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: COMPANY_ACCESS_CODE
        value: NityaCloudtech#resume
      - key: AI_PROVIDER
        value: local
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      - key: LOG_LEVEL
        value: INFO
      # IMPORTANT: replace with your deployed frontend origin(s), comma-separated.
      # Never ship "*" to production.
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-domain.example
      # Set to "groq" / "gemini" / "openrouter" and provide the matching key to
      # enable hosted AI generation (falls back to the local engine otherwise).
      - key: GROQ_API_KEY
        sync: false
