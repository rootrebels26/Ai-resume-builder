services:
  - type: web
    name: ai-resume-builder-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_V1_PREFIX
        value: /api/v1
      - key: AI_PROVIDER
        value: local
      - key: MAX_UPLOAD_SIZE_MB
        value: 10
      - key: ALLOWED_ORIGINS
        value: "*"
